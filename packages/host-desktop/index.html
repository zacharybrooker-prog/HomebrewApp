  <body style="background: black; color: white; font-family: sans-serif; padding: 2rem; text-align: center;">
    <h1>Error: Incorrect Vercel Deployment</h1>
    <p>If you are seeing this screen, Vercel has deployed the <strong>host-desktop</strong> folder instead of the <strong>web</strong> folder.</p>
    <p>Please go to your Vercel Project Settings -> General -> Root Directory, and change it to <code>packages/web</code>, then trigger a new deployment.</p>
